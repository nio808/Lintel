name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build, test, publish, package
        shell: pwsh
        run: ./build.ps1 -All
      - name: Installer script checks (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/installer/Install.Tests.ps1
      - name: Installer script checks (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File tests/installer/Install.Tests.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Lintel-win-x64
          path: artifacts/release/Lintel-win-x64.zip
          if-no-files-found: error
