name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: Lintel version (Settings > About), placeholder: "1.0.0" }
    validations: { required: true }
  - type: input
    id: windows
    attributes: { label: Windows version, placeholder: "Windows 11 23H2 (build 22631)" }
    validations: { required: true }
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options: [One-liner (install.ps1), Portable zip, Built from source]
  - type: textarea
    id: what
    attributes: { label: What happened, and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
  - type: textarea
    id: log
    attributes:
      label: Log excerpt (%LOCALAPPDATA%\Lintel\logs\app.log)
      description: Logs contain no tokens or clipboard contents. Remove anything personal anyway.
      render: text
