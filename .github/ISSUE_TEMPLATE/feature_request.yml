name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes: { label: What would you like, and what problem does it solve? }
    validations: { required: true }
  - type: textarea
    id: touches
    attributes: { label: What would it need to read or do on the PC? (for the permission list) }
